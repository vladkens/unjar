[package]
name = "unjar"
version = "0.1.1"
edition = "2024"
description = "Read and export cookies from local browser profiles. CLI and Rust library."
authors = ["vladkens"]
license = "MIT"
repository = "https://github.com/vladkens/unjar"
homepage = "https://github.com/vladkens/unjar"
documentation = "https://docs.rs/unjar"
readme = "readme.md"
include = ["/src/**", "/Cargo.toml", "/Cargo.lock", "/LICENSE", "/changelog.md", "/readme.md"]
keywords = ["cookies", "browser", "chrome", "firefox", "http"]
categories = ["command-line-utilities", "web-programming"]

[package.metadata.docs.rs]
no-default-features = true

[lib]
name = "unjar"
path = "src/lib.rs"

[[bin]]
name = "unjar"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap", "dep:comfy-table"]

[profile.release]
panic = "abort"
strip = true
lto = true

[dependencies]
aes = "0.9.3"
cbc = { version = "0.2.1", features = ["alloc"] }
clap = { version = "4.6.7", features = ["derive"], optional = true }
comfy-table = { version = "8.0.1", optional = true }
dirs = "7.0.0"
pbkdf2 = "0.13.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
